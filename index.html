<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d46">
<title>캠핑장 찾기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/app.css?v=3">
</head>
<body>
<header class="top">
  <div class="row1">
    <h1>⛺ 캠핑장 찾기</h1>
    <button id="btnSettings" class="icon-btn" aria-label="설정">⚙︎</button>
  </div>
  <button id="btnOrigin" class="origin-chip"><span class="pin">📍</span><span id="originName">기준점 선택</span><span class="chev">›</span></button>
  <div class="row2">
    <div class="seg" id="segSlot">
      <button data-v="fri">금 15:00</button><button data-v="sat">토 10:00</button>
    </div>
    <div class="seg" id="segLimit">
      <button data-v="90">1.5시간</button><button data-v="120">2시간</button><button data-v="0">전체</button>
    </div>
  </div>
  <div class="row3">
    <input id="q" type="search" placeholder="캠핑장 이름·지역 검색" autocomplete="off">
    <button id="btnFilter" class="filter-btn">필터<span id="filterCount" class="badge" hidden></span></button>
  </div>
  <div class="when" id="whenNote"></div>
</header>

<main>
  <section id="tabMap" class="tab">
    <div id="map"></div>
    <div id="mapMsg" class="map-msg" hidden></div>
  </section>
  <section id="tabList" class="tab" hidden>
    <div class="list-bar">
      <span id="listCount"></span>
      <button id="btnHidden" class="hid-chip" hidden></button>
      <select id="sortSel" aria-label="정렬">
        <option value="time">이동시간순</option>
        <option value="dist">거리순</option>
        <option value="name">이름순</option>
        <option value="region">지역순</option>
      </select>
      <div class="seg small" id="segView"><button data-v="card">카드</button><button data-v="table">표</button></div>
    </div>
    <div id="listBody"></div>
    <div class="list-foot">
      <button id="btnMore" class="ghost" hidden>더 보기</button>
      <button id="btnCheckAll" class="ghost" hidden></button>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="map" class="on">🗺️<span>지도</span></button>
  <button data-tab="list">📋<span>목록</span></button>
  <button data-tab="fav">⭐<span>즐겨찾기</span></button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg"></div>
  <div class="sheet-card">
    <div class="sheet-head"><b id="sheetTitle"></b><button class="icon-btn" id="sheetClose" aria-label="닫기">✕</button></div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="assets/app.js?v=3"></script>
</body>
</html>
